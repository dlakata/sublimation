# sublimation.example.conf — copy to sublimation.conf and edit.
#
#     cp sublimation.example.conf sublimation.conf
#
# sublimation.conf is gitignored, because it names files on your disk and nobody else's
# checkout has them. This file is the tracked copy, and should stay free of anything personal.
# `just setup` makes the copy for you.
#
# The standing answers to questions a week would otherwise ask every time. Nothing in here is
# required: an absent file, an absent key and an empty value all mean the same thing, which is
# that the week is assembled the way it would have been anyway.
#
# One `key = value` per line, `#` on its own line for a comment, the last assignment winning —
# petrograph's providers.conf without the sections, because there is only one thing being
# configured here rather than one per provider.

# ── what plays under the narration ───────────────────────────────────────────
# Written into each new session as `music:`, which stage 5 mixes the letter over into the
# master you play. Left empty, the narration is voice alone.
#
# Most weeks are the same bed, which is why this lives in a file rather than on the command
# line — name it once and every week after is one command with nothing to remember.
#
# `~` is expanded. A bare relative path is resolved against this file, which is the directory
# you are thinking about while editing it. Comma-separate for several: they play in order,
# each crossfading into the next, and the sequence loops if the letter outlasts them. Give
# those as absolute paths (or `~/…`) — the relative rule is for naming one track, and the
# commas in a list are resolved against the disk, so `{Teichiku Records Co., Ltd. TECD-28262}`
# stays one path rather than becoming two that exist nowhere.
#
# The path is checked when the week is built, not when the narration reaches for it, so a
# mistyped bed costs you a re-run of `begin-sublimation` rather than the read and the letter.
# `just doctor` checks it before either.
music =

# The voice is not here, because a voice is not a path you set — it is a recording of somebody,
# and it lives in voices/. `just voice <recording>` installs one; `just doctor` says which a
# run would use.
